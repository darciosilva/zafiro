# Zafiro 遥测契约(PRD v1.0)。两端的事实来源(R-51)。
# 手写镜像:business/api/src/main/java/com/niki914/zafiro/api/telemetry/TelemetryContract.kt
# 常量名字以服务端 scripts/check-contract.ts 的 MAPPING 为准。
# 本期 events 与 custom 为空(R-68)。

schema_version: 1
contract_version: 1

# 整个渠道名必须匹配该模式。对应 LIMIT_CHANNEL_NAME_PATTERN。
channel_name_pattern: "[a-z0-9_]{1,32}"

# kind 同时写在 CHANNEL_*_KIND。上报信封不带 kind。
# github=official, xposed=repo, dev=dev, legacy=legacy, unknown=unknown。
# first_channel_only 为 true 时,该渠道只用于 install.first_channel。
# 本期没有应用市场渠道。
channels:
  - name: github
    kind: official
    first_channel_only: false
  - name: xposed
    kind: repo
    first_channel_only: false
  - name: dev
    kind: dev
    first_channel_only: false
  - name: legacy
    kind: legacy
    first_channel_only: true
  - name: unknown
    kind: unknown
    first_channel_only: false

# 每项: name、description、labels、status(active 或 deprecated)、added_in、replaced_by。
# 标签按声明顺序。replaced_by 为空时不写。expired 的事件不出现在客户端常量里(R-47)。
events: []

# 每项: name、type(string|int|bool|enum)、role(dimension|measure,仅 count)、
# agg(sum|max,仅 measure)、enum_values、max_chars、min、max、added_in。
# 值为空的可选字段不写。键按 scope 分三组。
custom:
  envelope: []
  day: []
  count: []

# 布尔键没有 min/max。整数键的默认值落在 min 与 max 之间(含端点)。
config_keys:
  - name: telemetry_enabled
    type: bool
    default: true
  - name: report_interval_hours
    type: int
    default: 24
    min: 24
    max: 168
  - name: config_ttl_hours
    type: int
    default: 12
    min: 12
    max: 168

limits:
  body_bytes: 32768
  days_min: 1
  days_max: 8
  counts_per_day: 64
  firsts_per_day: 64
  unplanned_events_per_day: 8
  name_length: 40
  count_n_min: 1
  count_n_max: 1000000
  custom_keys: 16
  custom_undeclared_keys: 8
  custom_string_length: 40
  brand_length: 64
  model_length: 64
  installer_length: 100
  tz_offset_min: -720
  tz_offset_max: 840
  metric_min: 0
  metric_max: 2147483647
  channel_name_min: 1
  channel_name_max: 32
  lang_length: 16
  app_lang_length: 16
  locale_region_length: 2
  day_key_length: 36
  activity_window_days: 8
  client_retention_past_days: 7
  clock_rollback_days: 8
  deleted_day_memory_days: 9
  rev_min: 1
  dropped_days_min: 0
  counts_truncated_min: 0
  version_code_min: 1

# 顺序与 PROFILE_FIELDS 一致。含 app.app_lang 与 install.installer,不只是 device.*。
# 不含 gms、rom_family。类型和可空来自安卓 schema。
profile_fields:
  - name: api_level
    type: int
    nullable: true
  - name: brand
    type: string
    nullable: false
  - name: model
    type: string
    nullable: false
  - name: abi
    type: string
    nullable: false
  - name: ram_gb
    type: int
    nullable: false
  - name: screen_class
    type: string
    nullable: false
  - name: lang
    type: string
    nullable: true
  - name: app_lang
    type: string
    nullable: true
  - name: locale_region
    type: string
    nullable: true
  - name: tz_id
    type: string
    nullable: false
  - name: tz_offset_min
    type: int
    nullable: false
  - name: installer
    type: string
    nullable: true

# 总内存 GB 向上取到不小于它的最小档;大于 24 记 24。
ram_gb_buckets: [2, 3, 4, 6, 8, 12, 16, 24]

# 不大于最小宽度 dp 的最大档;小于 320 记 320。
screen_width_buckets: [320, 360, 400, 480, 600, 720]

# 离 densityDpi 最近的一档;距离相等取较高档。列表按 dpi 升序,较高档在后。
screen_density:
  - name: mdpi
    dpi: 160
  - name: hdpi
    dpi: 240
  - name: xhdpi
    dpi: 320
  - name: xxhdpi
    dpi: 480
  - name: xxxhdpi
    dpi: 640

build_types:
  - release
  - debug
